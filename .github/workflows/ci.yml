name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lockfile up to date
        run: uv lock --check

      - name: Lint (ruff)
        run: uv run --frozen ruff check .

      - name: Format (black)
        run: uv run --frozen black .

      - name: Type check (mypy)
        run: uv run --frozen mypy vor_agents/ main.py scripts/ dashboard/

      - name: Security scan (bandit)
        run: uv run --frozen bandit -r vor_agents/ main.py scripts/ -f txt -q

      - name: Test (pytest)
        run: uv run --frozen pytest -v

      - name: Commit formatting fixes
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "Apply automatic formatting fixes [skip ci]" || true
            git push
          fi
