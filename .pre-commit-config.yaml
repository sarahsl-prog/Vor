# Vör — local pre-commit hooks.
#
# `language: system` (not the usual pre-commit-hosted mirrors) deliberately:
# runs the ruff/black/mypy/bandit already pinned in requirements-dev.txt,
# from this repo's own venv, so pre-commit and CI (.github/workflows/ci.yml)
# can never drift to different tool versions. Run `pip install -r
# requirements-dev.txt` once, then `pre-commit install`.
repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: ruff check
        language: system
        types: [python]

      - id: black
        name: black
        entry: black
        language: system
        types: [python]

      - id: mypy
        name: mypy (vor_agents/, main.py)
        entry: mypy vor_agents/ main.py
        language: system
        pass_filenames: false
        types: [python]

      - id: bandit
        name: bandit (vor_agents/, main.py)
        entry: bandit -r vor_agents/ main.py -f txt -q
        language: system
        pass_filenames: false
        types: [python]
