# Vör — local pre-commit hooks.
#
# `language: system` + `uv run --frozen` (not the usual pre-commit-hosted
# mirrors) deliberately: runs the ruff/black/mypy/bandit versions locked in
# uv.lock, from this repo's own uv-managed venv, so pre-commit and CI
# (.github/workflows/ci.yml) can never drift to different tool versions.
# `--frozen` means the hooks never mutate the lockfile. Requires `uv` on PATH.
# Run `uv sync` once, then `pre-commit install`.
repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: uv run --frozen ruff check
        language: system
        types: [python]

      - id: black
        name: black
        entry: uv run --frozen black
        language: system
        types: [python]

      - id: mypy
        name: mypy (vor_agents/, main.py)
        entry: uv run --frozen mypy vor_agents/ main.py
        language: system
        pass_filenames: false
        types: [python]

      - id: bandit
        name: bandit (vor_agents/, main.py)
        entry: uv run --frozen bandit -r vor_agents/ main.py -f txt -q
        language: system
        pass_filenames: false
        types: [python]
