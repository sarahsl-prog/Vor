[pytest]
asyncio_mode = strict
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
pythonpath = .

# Integration tests are excluded from the default run: they call the real
# Gemini API, which costs money and is non-deterministic, so they must
# never gate CI (see docs/TESTING_PLAN.md). Run them explicitly with:
#     pytest -m integration
addopts = -m "not integration"

markers =
    integration: hits the real Gemini API; needs credentials, costs money, excluded by default
